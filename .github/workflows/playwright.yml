name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Install Playwright OS Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Przekazujemy puste/mockowane zmienne środowiskowe, aby Next.js przeszedł kompilację z wbudowanymi fallbackami
        NEXT_PUBLIC_CONTENTFUL_SPACE_ID: mock-space-id
        NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: mock-access-token
        CONTENTFUL_MANAGEMENT_TOKEN: mock-mgmt-token
        CONTENTFUL_PREVIEW_ACCESS_TOKEN: mock-preview-token
        CONTENTFUL_PREVIEW_SECRET: mock-secret
        CONTENTFUL_REVALIDATE_SECRET: mock-revalidate-secret
        NEXT_PUBLIC_GA_ID: G-MOCKID
        RESEND_API_KEY: re_mockapikey
        CI: true

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
